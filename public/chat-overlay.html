<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat-Overlay</title>
<style>
@font-face{font-family:"Akzidenz Grotesk Bold";src:local("Akzidenz Grotesk Bold"),local("Akzidenz-Grotesk BQ Bold"),local("Akzidenz-Grotesk Pro Bold");font-weight:700;font-display:swap}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}
body{--accent:#FAB70A;--scale:1;--ink:#1b1d12;--olive:#2f3313;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:700;line-height:1.25}
body[data-font="custom"]{font-family:var(--font,system-ui),system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body[data-font="akzidenz"]{font-family:"Akzidenz Grotesk Bold","Akzidenz-Grotesk BQ Bold",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
/* Schriftgröße folgt der Breite der Browserquelle (1920 px Breite ≈ 31 px), Regler „Schriftgröße“ skaliert zusätzlich. */
#chat{position:absolute;left:var(--mx,24px);bottom:var(--my,24px);width:min(calc(100% - 2*var(--mx,24px)),max(36vw,380px),780px);
  display:flex;flex-direction:column;align-items:flex-start;gap:.5em;font-size:calc(var(--scale)*clamp(15px,1.6vw,36px))}
body[data-align="right"] #chat{left:auto;right:var(--mx,24px);align-items:flex-end}
body[data-anchor="top"] #chat{bottom:auto;top:var(--my,24px)}
.msg{display:flex;flex-direction:column;align-items:flex-start;max-width:100%;animation:in .32s ease-out both}
body[data-align="right"] .msg{align-items:flex-end;animation-name:inRight}
.msg.out{animation:out .35s ease-in both}
.tab{display:flex;align-items:center;gap:.35em;max-width:100%;padding:.16em 1.05em .12em .7em;font-size:.82em;white-space:nowrap;position:relative;z-index:1}
.nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.dot{flex:none;width:.5em;height:.5em;border-radius:50%}
.badges{display:inline-flex;align-items:center;gap:.25em;flex:none}
.badge{height:1.05em;width:auto;display:block}
.bubble{max-width:100%;min-width:min(100%,11em);padding:.42em .8em .5em;overflow-wrap:anywhere;word-break:break-word;position:relative}
.rp{display:inline-block;margin-right:.4em;font-size:.78em;opacity:.7}
.emote{height:1.55em;width:auto;vertical-align:middle;margin:-.2em .06em -.1em}
.stack{position:relative;display:inline-block;vertical-align:middle}
.stack .zw{position:absolute;left:0;top:50%;height:1.55em;width:auto;transform:translateY(-50%);margin:0}

/* Look „Dunkel“ */
body[data-theme="dark"] .tab{background:var(--tab,var(--accent));color:var(--tabfg,var(--ink));clip-path:polygon(0 0,100% 0,calc(100% - .7em) 100%,0 100%);border-radius:.3em 0 0 0}
body[data-theme="dark"] .bubble{background:var(--bub,rgba(22,25,30,calc(.9*var(--bo,1))));color:var(--bubfg,#fff);border:1px solid rgba(255,255,255,.12);border-left:.3em solid var(--accent);border-radius:0 .6em .6em .6em;box-shadow:0 .15em .5em rgba(0,0,0,.35)}
/* Look „Hell“ */
body[data-theme="light"] .tab{background:linear-gradient(to right,var(--tab,var(--olive)) calc(100% - 1em),var(--accent) calc(100% - 1em));color:var(--tabfg,#fff);padding-right:1.4em;clip-path:polygon(0 0,100% 0,calc(100% - .55em) 100%,0 100%);border-radius:.35em 0 0 0}
body[data-theme="light"] .bubble{background:var(--bub,rgba(247,247,244,var(--bo,1)));color:var(--bubfg,#1c1e14);border-radius:0 .9em .9em .9em;box-shadow:0 .15em .5em rgba(0,0,0,.28)}
/* Look „Kantig“ */
body[data-theme="angular"] .tab{background:linear-gradient(115deg,var(--tab,var(--olive)) calc(100% - 1.25em),var(--accent) calc(100% - 1.25em),var(--accent) calc(100% - .9em),transparent calc(100% - .9em));color:var(--tabfg,#fff);
  padding:.16em 1.9em .12em 1em;clip-path:polygon(.55em 0,100% 0,calc(100% - .9em) 100%,0 100%)}
body[data-theme="angular"] .bubble{margin-left:.8em;background:linear-gradient(to top,var(--accent) .24em,var(--bub,rgba(244,244,240,var(--bo,1))) .24em);color:var(--bubfg,#1a1c10);padding:.4em 1.9em .62em 1.6em;
  clip-path:polygon(.9em 0,100% 0,calc(100% - .9em) 100%,0 100%);filter:none}
body[data-theme="angular"] .msg{filter:drop-shadow(0 .12em .25em rgba(0,0,0,.4))}
body[data-theme="angular"] .dot{box-shadow:0 0 0 .08em rgba(255,255,255,.7)}
body[data-theme="dark"] .dot,body[data-theme="light"] .dot{box-shadow:0 0 0 .08em rgba(255,255,255,.65)}
/* 9.27.1 Ereigniskarten: gleiche Formen wie Nachrichten, Symbol folgt der Reiterfarbe (Maske, Alphakanal der Bilddatei) */
.ico{flex:none;width:1.15em;height:1.15em;background-color:currentColor;-webkit-mask:var(--ico) center/contain no-repeat;mask:var(--ico) center/contain no-repeat}
.card.follow .ico{--ico:url(/chat-overlay-icons/herz.png)}
.card.raid .ico{--ico:url(/chat-overlay-icons/raid.png)}
.card.sub .ico{--ico:url(/chat-overlay-icons/abo.png)}
.card.gift .ico{--ico:url(/chat-overlay-icons/geschenk.png)}
.card.bits .ico{--ico:url(/chat-overlay-icons/bits.png)}
.card.redeem .ico{--ico:url(/chat-overlay-icons/funken.png)}
.card .bubble{font-size:1.08em}
.card .who{color:var(--accent)}
body[data-theme="light"] .card .who,body[data-theme="angular"] .card .who{color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:.14em;text-underline-offset:.14em;text-decoration-skip-ink:none}
.card .sub{font-size:.8em;opacity:.8;margin-left:.45em;font-weight:600}
/* 9.28.3: Textschatten (dunkler Look: dunkler Schatten, helle Blasen: heller Schein) */
body[data-tshadow="soft"] .bubble{text-shadow:0 0 .22em rgba(0,0,0,.85),0 .05em .12em rgba(0,0,0,.8)}
body[data-tshadow="strong"] .bubble{text-shadow:0 0 .18em #000,0 0 .3em #000,0 .06em .1em #000}
body[data-tshadow="soft"][data-theme="light"] .bubble,body[data-tshadow="soft"][data-theme="angular"] .bubble{text-shadow:0 0 .22em rgba(255,255,255,.9),0 .05em .12em rgba(255,255,255,.8)}
body[data-tshadow="strong"][data-theme="light"] .bubble,body[data-tshadow="strong"][data-theme="angular"] .bubble{text-shadow:0 0 .18em #fff,0 0 .3em #fff,0 .06em .1em #fff}
/* 9.27.3: Textur über der Blase und eigene Symbole (Bildplätze der Installation) */
body.has-tex .bubble::before{content:"";position:absolute;inset:0;background:var(--tex) center/auto repeat;opacity:var(--texo,.6);pointer-events:none;border-radius:inherit}
.ico.custom{-webkit-mask:none;mask:none;background-color:transparent;background-size:contain;background-position:center;background-repeat:no-repeat}
@keyframes in{from{opacity:0;transform:translateX(-1.6em)}to{opacity:1;transform:none}}
@keyframes inRight{from{opacity:0;transform:translateX(1.6em)}to{opacity:1;transform:none}}
@keyframes out{from{opacity:1}to{opacity:0;transform:translateY(-.4em)}}
@media (prefers-reduced-motion:reduce){.msg,.msg.out{animation-duration:1ms}}
</style></head><body data-theme="dark" data-align="left" data-font="system">
<div id="chat" aria-live="off"></div>
<script src="/chat-overlay.js"></script></body></html>

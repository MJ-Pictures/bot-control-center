<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stubenkontrolle Overlay</title><style>
@font-face{font-family:RobotoSlab;src:local("Roboto Slab")}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:RobotoSlab,"Roboto Slab",serif;color:#fff}.stage{position:relative;width:1920px;height:1080px;transform-origin:top left;overflow:hidden}.panel{position:absolute;left:90px;bottom:90px;width:1740px;padding:30px 36px;background:linear-gradient(135deg,rgba(15,20,26,.94),rgba(28,35,44,.9));border:2px solid rgba(250,183,10,.8);clip-path:polygon(0 0,96% 0,100% 24%,100% 100%,4% 100%,0 76%);opacity:0;transform:translateY(30px);transition:.35s}.panel.show{opacity:1;transform:none}.accent{color:rgb(250,183,10)}h1{font-size:54px;margin:0 0 8px}.meta{font-size:29px;display:flex;gap:28px;flex-wrap:wrap}.people{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:22px;max-height:360px;overflow:hidden}.person{background:rgba(255,255,255,.08);padding:11px 14px;border-radius:8px;font-size:23px;border-left:5px solid #777}.person.passed{border-left-color:#5dcc7a}.person.caught{border-left-color:#e15b5b}.spies{position:absolute;right:120px;top:70px;width:390px;height:560px;object-fit:contain;opacity:0;transition:.4s}.control .spies{opacity:1;animation:patrol 2.2s ease-in-out infinite alternate}@keyframes patrol{from{transform:translateX(80px) rotate(1deg)}to{transform:translateX(-80px) rotate(-1deg)}}.connection{position:absolute;right:20px;top:20px;font:18px system-ui;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:6px}.connection.ok{color:#8ff0a4}.polygon{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.18;pointer-events:none}.countdown{font-size:62px;font-weight:800;color:rgb(250,183,10)}.result-title{font-size:38px;margin-top:12px}.hidden{display:none}</style></head><body>
<div id="stage" class="stage"><img class="polygon" src="assets/polygon-placeholder.svg"><img class="spies" src="assets/spiess-placeholder.svg"><div id="conn" class="connection">WSS: getrennt</div><div id="panel" class="panel"><h1 id="title">Stubenkontrolle</h1><div class="meta"><span id="countdown"></span><span id="count"></span><span id="factor"></span><span id="command"></span></div><div id="resultTitle" class="result-title"></div><div id="phrase" class="result-title accent"></div><div id="people" class="people"></div></div></div>
<script>
const WS_URL="wss://DEINE-ADRESSE/ws/stubenkontrolle"; // öffentliche Adresse der Installation eintragen
const OVERLAY_KEY="HIER_OVERLAY_SCHLUESSEL_EINTRAGEN";
let ws=null,retry=1000,state=null,tick=null;
const $=id=>document.getElementById(id);function scale(){const s=Math.min(innerWidth/1920,innerHeight/1080);$("stage").style.transform=`scale(${s})`;}addEventListener("resize",scale);scale();
function connect(){const url=WS_URL+(WS_URL.includes("?")?"&":"?")+"key="+encodeURIComponent(OVERLAY_KEY);try{ws=new WebSocket(url)}catch{setTimeout(connect,retry);return}ws.onopen=()=>{$("conn").textContent="WSS: verbunden";$("conn").classList.add("ok");retry=1000};ws.onmessage=e=>{try{state=JSON.parse(e.data);render()}catch{}};ws.onclose=()=>{$("conn").textContent="WSS: getrennt";$("conn").classList.remove("ok");setTimeout(connect,retry);retry=Math.min(15000,retry*1.7)};ws.onerror=()=>ws.close();}
function names(p){return (p||[]).slice(0,24)}function render(){if(!state)return;const phase=state.phase||"idle",r=state.round;$("stage").classList.toggle("control",phase==="control");const show=phase!=="idle";$("panel").classList.toggle("show",show);if(!show)return;$("title").textContent=phase==="registration"?"ANMELDUNG ZUM SPIEL":phase==="control"?"KONTROLLE LÄUFT!":"ERGEBNIS DER RUNDE";$("count").textContent=`Teilnehmende: ${r?.participants?.length||0}`;$("factor").textContent=`Faktor: x${r?.factor||"–"}`;$("command").textContent=phase==="registration"?(state.config?.command||"!stube BETRAG"):"";$("resultTitle").textContent=phase==="result"?"Bestanden oder erwischt – die Abrechnung ist durch.":"";$("phrase").textContent=r?.overlayPhrase||"";$("people").innerHTML=names(r?.participants).map(p=>`<div class="person ${p.outcome||""}"><strong>${escapeHtml(p.name)}</strong><br>${p.bet} SP${phase==="result"?` · ${p.outcome==="passed"?`+${p.delta}`:`-${p.bet}`}`:""}</div>`).join("")+((r?.participants?.length||0)>24?`<div class="person">+${r.participants.length-24} weitere</div>`:"");updateCountdown();}
function updateCountdown(){if(!state)return;let end=null;if(state.phase==="registration")end=state.round?.joinEndsAt;else if(state.phase==="control")end=state.round?.controlEndsAt;if(!end){$("countdown").textContent="";return}const sec=Math.max(0,Math.ceil((new Date(end).getTime()-Date.now())/1000));$("countdown").textContent=`${sec}s`;}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}tick=setInterval(updateCountdown,250);connect();
</script></body></html>
